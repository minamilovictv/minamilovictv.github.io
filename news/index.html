<style>
  /* ============================================================
     RESET & BASE
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #1a1e2e;
    background: #fff;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
  button { font-family: inherit; }
  .container { max-width: 1400px; margin: 0 auto; padding: 0 40px; }

  /* ============================================================
     PAGE HERO (news header)
     ============================================================ */
  .page-hero {
    position: relative;
    background: var(--gradient-hero);
    overflow: hidden;
    padding: 72px 0 64px;
  }
  .page-hero::after {
    content: ""; position: absolute; top: -120px; right: -80px;
    width: 480px; height: 480px; border-radius: 50%;
    background: radial-gradient(circle, rgba(75,101,132,0.28) 0%, transparent 70%);
    pointer-events: none;
  }
  .page-hero-inner { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; padding: 0 40px; }
  .breadcrumb {
    font-size: var(--text-sm);
    color: rgba(255,255,255,0.5);
    margin-bottom: 16px;
    letter-spacing: 0.02em;
  }
  .breadcrumb a { color: rgba(255,255,255,0.65); text-decoration: none; }
  .breadcrumb a:hover { color: #fff; }
  .breadcrumb span { margin: 0 8px; opacity: 0.5; }

  .page-hero-overline {
    font-size: var(--text-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: rgba(255,255,255,0.55);
    margin-bottom: 16px;
  }
  .page-hero h1 {
    font-family: var(--font-display);
    font-size: var(--text-hero);
    font-weight: 700;
    color: #fff;
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin-bottom: 16px;
    max-width: 22ch;
  }
  .page-hero p {
    font-size: var(--text-base);
    color: rgba(255,255,255,0.7);
    line-height: 1.65;
    max-width: 60ch;
  }

  /* ============================================================
     FILTERS
     ============================================================ */
  .filters-wrap {
    background: #fff;
    border-bottom: 1px solid var(--line);
  }
  .filters-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .filter-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .filter-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--faint);
    margin-right: 4px;
    flex-shrink: 0;
    width: 80px;
  }
  .filter-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
  }
  .chip {
    background: var(--line-soft);
    border: 1px solid transparent;
    color: var(--ink-soft);
    font-size: var(--text-sm);
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    font-family: inherit;
    white-space: nowrap;
  }
  .chip:hover { background: var(--line); color: var(--navy); }
  .chip.active {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }
  .chip-count {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    color: var(--faint);
    font-weight: 600;
  }
  .chip.active .chip-count { color: rgba(255,255,255,0.6); }

  .results-meta {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 40px 0;
    font-size: var(--text-sm);
    color: var(--muted);
  }
  .results-meta strong { color: var(--ink); font-weight: 600; }

  /* ============================================================
     NEWS SECTION (grid container only — card styles live in
     components/news-card.html)
     ============================================================ */
  .news-section { padding: 32px 0 88px; background: #fff; }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 1024px) {
    .container, .filters-inner, .page-hero-inner, .results-meta { padding-left: 24px; padding-right: 24px; }
  }

  @media (max-width: 768px) {
    .nav-items { display: none; }
    .btn-partners { display: none; }
    .page-hero { padding: 56px 0 48px; }
    .filters-wrap { position: static; }
    .filter-label { width: auto; }
  }

  /* ---------- Pagination ---------- */
  .pagination {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin: 40px auto 8px;
    padding: 0 40px;
  }
  .pagination[hidden] { display: none; }
  .page-btn {
    min-width: 40px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    font-size: var(--text-sm);
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .page-btn:hover:not(:disabled):not(.active) { border-color: var(--navy); color: var(--navy); }
  .page-btn.active {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
    cursor: default;
  }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .page-gap { padding: 0 4px; color: var(--faint); user-select: none; }
  @media (max-width: 768px) {
    .pagination { padding: 0 20px; }
  }
</style>

<!-- ============================================================
     MODAL
     Mount point + CSS are injected at runtime from
     components/news-modal.html.

<!-- ============================================================
     PAGE SCRIPT
     Data comes from the shared data service (js/data-service.js,
     loaded just above). The page only owns: hero, filter state,
     grid container, and wiring components → modal.
     ============================================================ -->
<script src="/js/data-service.js"></script>
<script>
(function () {
  'use strict';

  /* ──────────────────────────────────────────────────────────
     CONFIG
     COMPONENTS_BASE — relative path to the components/ folder
     from this page. The news data source itself lives in
     js/data-service.js.
     ────────────────────────────────────────────────────────── */
  const COMPONENTS_BASE = "/components/";

  const PAGE_SIZE = 15;

  const STATE = {
    items: [],
    activeType: 'all',
    activeProgramme: 'all',
    page: 1
  };

  /* ──────────────────────────────────────────────────────────
     UTILITIES
     ────────────────────────────────────────────────────────── */
  function $(sel, ctx) { return (ctx || document).querySelector(sel); }
  function $$(sel, ctx) { return Array.from((ctx || document).querySelectorAll(sel)); }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ──────────────────────────────────────────────────────────
     COMPONENT LOADER
     Fetches a component HTML fragment and injects its <style>,
     markup, and <script> nodes into the host document so the
     embedded scripts execute.
     ────────────────────────────────────────────────────────── */
  async function loadComponent(url) {
    const res = await fetch(url, { cache: 'no-cache' });
    if (!res.ok) throw new Error('Component load failed: ' + url + ' → HTTP ' + res.status);
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');

    doc.querySelectorAll('style[data-wbf-component]').forEach(s => {
      document.head.appendChild(s.cloneNode(true));
    });
    Array.from(doc.body.childNodes).forEach(node => {
      if (node.nodeType === 1 && (node.tagName === 'SCRIPT' || node.tagName === 'STYLE')) return;
      document.body.appendChild(node.cloneNode(true));
    });
    doc.querySelectorAll('script[data-wbf-component]').forEach(orig => {
      const s = document.createElement('script');
      for (const attr of orig.attributes) s.setAttribute(attr.name, attr.value);
      s.textContent = orig.textContent;
      document.body.appendChild(s);
    });
  }

  /* ──────────────────────────────────────────────────────────
     FILTERS
     Items returned by WBFData.news.all() are already
     normalized (type lower-kebab-cased, drafts dropped,
     sorted by date desc).
     ────────────────────────────────────────────────────────── */
  function buildProgrammeFilters() {
    const wrap = $('#programme-filters');
    const programmes = Array.from(new Set(
      STATE.items.map(i => (i.programme || '').trim()).filter(Boolean)
    )).sort();

    $$('button[data-programme]:not([data-programme="all"])', wrap).forEach(b => b.remove());
    programmes.forEach(p => {
      const count = STATE.items.filter(i => (i.programme || '').trim() === p).length;
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.dataset.programme = p;
      btn.innerHTML = escapeHtml(p) + ' <span class="chip-count">' + count + '</span>';
      wrap.appendChild(btn);
    });
  }

  function getFiltered() {
    return STATE.items
      .filter(i => STATE.activeType === 'all' ? true : i.type === STATE.activeType)
      .filter(i => STATE.activeProgramme === 'all' ? true : (i.programme || '').trim() === STATE.activeProgramme);
  }

  function renderGrid() {
    const grid = $('#cards-grid');
    const meta = $('#results-meta');
    const list = getFiltered();                 // full filtered archive
    const total = list.length;
    const filtered = (STATE.activeType !== 'all' || STATE.activeProgramme !== 'all');
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));

    /* Keep the requested page in range (e.g. after a filter shrinks the set). */
    if (STATE.page > totalPages) STATE.page = totalPages;
    if (STATE.page < 1) STATE.page = 1;

    if (!total) {
      meta.innerHTML = '<strong>0</strong> articles' + (filtered ? ' matching your filters' : '');
      window.WBFNewsCard.renderEmpty(grid);
      renderPagination(1);
      return;
    }

    const start = (STATE.page - 1) * PAGE_SIZE;
    const pageItems = list.slice(start, start + PAGE_SIZE);
    const from = start + 1;
    const to = start + pageItems.length;

    meta.innerHTML = 'Showing <strong>' + from + '&ndash;' + to + '</strong> of <strong>' + total + '</strong> ' +
      (total === 1 ? 'article' : 'articles') + (filtered ? ' matching your filters' : '');

    window.WBFNewsCard.renderGrid(pageItems, grid);
    renderPagination(totalPages);
  }

  /* Windowed page controls: first, last, and a small window around the current page. */
  function renderPagination(totalPages) {
    const nav = $('#pagination');
    if (!nav) return;
    if (totalPages <= 1) { nav.innerHTML = ''; nav.hidden = true; return; }
    nav.hidden = false;

    const cur = STATE.page;
    const pageBtn = (p, active) =>
      '<button type="button" class="page-btn' + (active ? ' active' : '') + '" data-page="' + p + '"' +
      (active ? ' aria-current="page"' : '') + ' aria-label="Page ' + p + '">' + p + '</button>';

    /* Page numbers to show: 1, last, and current ± 1, with … for gaps. */
    const show = [];
    for (let p = 1; p <= totalPages; p++) {
      if (p === 1 || p === totalPages || (p >= cur - 1 && p <= cur + 1)) show.push(p);
      else if (show[show.length - 1] !== 'gap') show.push('gap');
    }

    let html = '<button type="button" class="page-btn" data-page="' + (cur - 1) + '"' +
      (cur === 1 ? ' disabled' : '') + ' aria-label="Previous page">&lsaquo; Prev</button>';
    show.forEach(p => { html += (p === 'gap') ? '<span class="page-gap">&hellip;</span>' : pageBtn(p, p === cur); });
    html += '<button type="button" class="page-btn" data-page="' + (cur + 1) + '"' +
      (cur === totalPages ? ' disabled' : '') + ' aria-label="Next page">Next &rsaquo;</button>';

    nav.innerHTML = html;
  }

  /* ──────────────────────────────────────────────────────────
     EVENT WIRING
     ────────────────────────────────────────────────────────── */
  function bindFilterChips() {
    $('#type-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-type]');
      if (!btn) return;
      STATE.activeType = btn.dataset.type;
      STATE.page = 1;                          // new filter → back to first page
      $$('button[data-type]').forEach(b => b.classList.toggle('active', b === btn));
      renderGrid();
    });

    $('#programme-filters').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-programme]');
      if (!btn) return;
      STATE.activeProgramme = btn.dataset.programme;
      STATE.page = 1;                          // new filter → back to first page
      $$('#programme-filters button[data-programme]').forEach(b => b.classList.toggle('active', b === btn));
      renderGrid();
    });
  }

  function bindPagination() {
    $('#pagination').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-page]');
      if (!btn || btn.disabled) return;
      const p = parseInt(btn.dataset.page, 10);
      if (!p || p === STATE.page) return;
      STATE.page = p;
      renderGrid();
      const anchor = $('.results-meta');
      if (anchor && anchor.scrollIntoView) anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  /* ──────────────────────────────────────────────────────────
     INIT
     ────────────────────────────────────────────────────────── */
  async function init() {
    const grid = $('#cards-grid');

    /* Inline skeleton until the card component CSS loads. */
    grid.innerHTML =
      '<div class="skeleton-card"><div class="sk sk-img" style="height:200px;background:var(--line);border-radius:0"></div></div>'.repeat(3);

    try {
      await loadComponent(COMPONENTS_BASE + 'news-card.html');
      await loadComponent(COMPONENTS_BASE + 'news-modal.html');
    } catch (err) {
      console.error('Component load failed:', err);
      grid.innerHTML =
        '<div style="grid-column:1/-1;padding:48px;text-align:center;color:var(--muted);background:var(--surface-alt);border-radius:10px">' +
          '<h3 style="color:var(--ink);font-size:17px;margin-bottom:6px">Components could not be loaded</h3>' +
          '<p>Open this page through a local web server (e.g. <code>python -m http.server</code>) ' +
          'rather than directly via <code>file://</code>.</p>' +
        '</div>';
      return;
    }

    if (!window.WBFNewsCard || !window.WBFNewsModal) {
      console.error('Component API missing after load');
      return;
    }
    if (!window.WBFData || !window.WBFData.news) {
      console.error('WBFData.news unavailable — is js/data-service.js loaded?');
      window.WBFNewsCard.renderError(grid);
      return;
    }

    window.WBFNewsCard.renderSkeletons(grid, 6);
    bindFilterChips();
    bindPagination();

    try {
      STATE.items = await window.WBFData.news.all();
      buildProgrammeFilters();
      renderGrid();

      /* Cards → modal, plus ?article=ID deep links. */
      window.WBFNewsCard.bindClicks(grid, STATE.items, item => window.WBFNewsModal.open(item));
      window.WBFNewsModal.enableDeepLink(STATE.items, 'id');
    } catch (err) {
      console.error(err);
      window.WBFNewsCard.renderError(grid);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
